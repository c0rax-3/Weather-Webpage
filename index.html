<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="index.css" rel="stylesheet" />
    <script src="index.js" type="module" defer></script>
    <title>Weather</title>
  </head>
  <body>
    <h1 class="title">Weather App</h1>
    <div class="body">
      <input
        class="location"
        placeholder="Location here"
        name="location"
        type="text"
      />
      <input
        class="startDate"
        placeholder="Start Date here"
        name="startDate"
        type="date"
      />
      <input
        class="endDate"
        placeholder="End Date here"
        name="endDate"
        type="date"
      />
      <button class="submit">Submit</button>
      <div class="response">
        <div class="locationRetrieved"></div>
        <div class="date"></div>
        <div class="tempmax"></div>
        <div class="tempmin"></div>
        <div class="temp"></div>
        <div class="humidity"></div>
        <div class="precip"></div>
        <div class="preciptype"></div>
        <div class="precipprob"></div>
        <div class="windspeed"></div>
        <div class="conditions"></div>
        <div class="description"></div>
      </div>
    </div>

  </body>
</html>
